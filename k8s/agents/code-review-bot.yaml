# runx-public-repo-gate: allow-file fleet_host_alias,network_topology
---
# code-review-bot — Helixon fleet agent that performs automated code reviews
# on PRs targeting the personal repos. Reads engram for context, writes
# review comments to GitHub via PAT.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-review-bot
  namespace: helixon-agents
  labels:
    app: code-review-bot
    fleet: helixon
    role: code-review
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-review-bot
  template:
    metadata:
      labels:
        app: code-review-bot
        fleet: helixon
    spec:
      containers:
        - name: code-review-bot
          image: ghcr.io/nfsarch33/helixon-agents:code-review-bot-v13923
          imagePullPolicy: IfNotPresent
          command: ["/helixon-platform"]
          args:
            - serve
            - --config=/etc/helixon/code-review-bot.yaml
            - --log-level=info
          ports:
            - name: healthz
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: ENGRAM_ADDR
              value: "127.0.0.1:8280"
            - name: ENGRAM_DB_PATH
              value: "/var/lib/engram/engram.db"
            - name: GITHUB_PAT_OP
              value: "op://Cursor_IronClaw/github pat/password"
            - name: SPRINTBOARD_MCP_URL
              value: "http://sprintboard-api.helixon:8080"
          volumeMounts:
            - name: config
              mountPath: /etc/helixon
              readOnly: true
            - name: engram-shared
              mountPath: /var/lib/engram
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: code-review-bot-config
        - name: engram-shared
          hostPath:
            path: /var/lib/engram
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: code-review-bot
  namespace: helixon-agents
  labels:
    app: code-review-bot
spec:
  type: ClusterIP
  selector:
    app: code-review-bot
  ports:
    - name: healthz
      port: 8080
      targetPort: healthz
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-review-bot-config
  namespace: helixon-agents
data:
  # v18779: `helixon serve` decodes this document STRICTLY, so every key
  # here must exist in helixon.FileConfig. The previous payload used
  # `channels:` and `tools:` blocks the loader has never had fields for —
  # non-strict decoding discarded them silently, so this ConfigMap
  # configured nothing while looking like it configured everything. The
  # intent is preserved below until those blocks are implemented.
  #
  #   channels: webhook /webhook/github (secret from 1Password)
  #             engram read (127.0.0.1:8280; code-review-context, pr-history)
  #             mcp write -> sprintboard_create_ticket
  #   tools:    file_read, grep_search, shell(allowlist: gh, git),
  #             github_post_comment
  code-review-bot.yaml: |
    agent_id: code-review-bot-v13923
    heartbeat_every: 60s
    sprintboard:
      url: http://sprintboard-api.helixon:8080
      capabilities: "code-review"
    sandbox:
      workspace: /var/lib/engram
      workspace_access: ro
      network: none
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: code-review-bot
  namespace: helixon-agents
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-review-bot
  namespace: helixon-agents
subjects:
  - kind: ServiceAccount
    name: code-review-bot
    namespace: helixon-agents
roleRef:
  kind: Role
  name: code-review-bot
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-review-bot
  namespace: helixon-agents