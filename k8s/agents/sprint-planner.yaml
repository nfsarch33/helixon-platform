# runx-public-repo-gate: allow-file personal_path_id
# The operator home path below is a live hostPath/mountPath consumed by the
# deployed sprint-planner. It wants parameterising (env or kustomize overlay)
# rather than rewriting in place, which would break the running mount.
---
# sprint-planner — Helixon fleet agent that auto-plans sprints based on
# carry-forward register + sprintboard tickets. Reads engram + carry-forward
# register; writes planned sprints to SprintBoard MCP.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprint-planner
  namespace: helixon-agents
  labels:
    app: sprint-planner
    fleet: helixon
    role: sprint-planning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprint-planner
  template:
    metadata:
      labels:
        app: sprint-planner
        fleet: helixon
    spec:
      containers:
        - name: sprint-planner
          image: ghcr.io/nfsarch33/helixon-agents:sprint-planner-v13923
          imagePullPolicy: IfNotPresent
          command: ["/helixon-platform"]
          args:
            - serve
            - --config=/etc/helixon/sprint-planner.yaml
            - --log-level=info
          ports:
            - name: healthz
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9100
              protocol: TCP
          env:
            - name: ENGRAM_ADDR
              value: "127.0.0.1:8280"
            - name: ENGRAM_DB_PATH
              value: "/var/lib/engram/engram.db"
            - name: CARRY_FORWARD_REGISTER
              value: "/home/jason/cursor-global-kb/carry-forward-register.ndjson"
            - name: SPRINTBOARD_MCP_URL
              value: "http://sprintboard-api.helixon:8080"
          volumeMounts:
            - name: config
              mountPath: /etc/helixon
              readOnly: true
            - name: engram-shared
              mountPath: /var/lib/engram
              readOnly: true
            - name: carry-forward-shared
              mountPath: /home/jason/cursor-global-kb
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: sprint-planner-config
        - name: engram-shared
          hostPath:
            path: /var/lib/engram
            type: Directory
        - name: carry-forward-shared
          hostPath:
            path: /home/jason/cursor-global-kb
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sprint-planner
  namespace: helixon-agents
  labels:
    app: sprint-planner
spec:
  type: ClusterIP
  selector:
    app: sprint-planner
  ports:
    - name: healthz
      port: 8080
      targetPort: healthz
      protocol: TCP
    - name: metrics
      port: 9100
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sprint-planner-config
  namespace: helixon-agents
data:
  # v18779: `helixon serve` decodes this document STRICTLY, so every key
  # here must exist in helixon.FileConfig. The previous payload used
  # `channels:` and `tools:` blocks that the loader has never had fields
  # for — non-strict decoding discarded them silently, so this ConfigMap
  # configured nothing but looked like it configured everything. The intent
  # is preserved below as a comment until those blocks are implemented.
  #
  #   channels: cron(0 */4 * * *) -> scan_carry_forward
  #             engram read (127.0.0.1:8280; sprint-history, agent-capabilities)
  #             mcp write -> sprintboard_create_ticket
  #   tools:    file_read, shell(allowlist: gh, jq), mcp_call
  sprint-planner.yaml: |
    agent_id: sprint-planner-v13923
    heartbeat_every: 60s
    sprintboard:
      url: http://sprintboard-api.helixon:8080
      capabilities: "sprint-planning"
    sandbox:
      workspace: /var/lib/engram
      workspace_access: ro
      network: none
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sprint-planner
  namespace: helixon-agents
rules:
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods, services]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sprint-planner
  namespace: helixon-agents
subjects:
  - kind: ServiceAccount
    name: sprint-planner
    namespace: helixon-agents
roleRef:
  kind: Role
  name: sprint-planner
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sprint-planner
  namespace: helixon-agents
