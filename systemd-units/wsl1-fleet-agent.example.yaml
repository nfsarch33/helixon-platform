# runx-public-repo-gate: allow-file fleet_host_alias,network_topology
# WSL1 fleet-agent configuration for helixon serve
# Connects to local LLM router (127.0.0.1:8080), sprintboard (127.0.0.1:9400),
# and registers itself with svcregistryd (127.0.0.1:7777).

agent_id: helixon-fleet-wsl1
system_prompt: |
  You are the wsl1 fleet agent on win1/wsl1 (the Helixon central node).
  You receive tasks from the SprintBoard, execute them using available
  tools (registra, llm-router, engramd, svcregistryd), and report
  results. Be thorough and include evidence of completion.
session_dsn: "file:%h/.local/share/helixon/fleet-wsl1.db?cache=shared&mode=rwc"
max_iterations: 50
max_tokens: 128000
timeout: 10m
heartbeat_every: 30s

provider:
  kind: openai-compat
  base_url: http://127.0.0.1:8080/v1
  model: Qwen3.6-27B-MTP
  # v18778: fleet-agent.service in this directory runs
  # `secrets-bootstrap --service fleet-agent`, which exports the router's
  # bearer as LLM_ROUTER_TOKEN -- it does NOT export OPENAI_API_KEY. This
  # example named the wrong variable, so a reader following it verbatim got
  # `api_key env var "OPENAI_API_KEY" is not set` at startup, which is the
  # same crash loop that ran 300+ times in v14571. The router is the
  # provider, so the router's own token is the credential.
  api_key: "${LLM_ROUTER_TOKEN}"
  timeout: 60s

sprintboard:
  url: http://127.0.0.1:9400
  capabilities: "code,test,review,deploy,registry"

registra:
  registry_path: /home/jaslian/Code/cursor-global-kb/inventory/services/registry.yaml
  bridge_url: http://127.0.0.1:7777
  node_alias: wsl1

# v18779 guardrails. Every block below is OPTIONAL and defaults to ON — an
# absent block is not a disabled guardrail. The values shown are the defaults.
#
# NOTE: since v18779 this file is decoded STRICTLY. An unknown key is now a
# startup error naming the key and line, instead of being silently discarded
# (which is what happened to the `registra:` block above for months).
#
# sandbox:
#   enabled: true
#   engine: podman                                  # the only permitted engine
#   image: docker.io/library/golang:1.26-bookworm   # pinned; must be present
#   network: none                                   # none | bridge
#   userns: keep-id                                 # keep-id | disabled
#   memory_limit: 2g
#   pids_limit: 256
#   tmpfs_size: 256m
#   workspace: <process working directory>          # host dir the agent works in
#   workspace_access: rw                            # none | ro | rw
#   workspace_mount: /workspace                     # where it appears inside
#   timeout: 2m
#   max_output_bytes: 65536
#   binds:                                          # extra mounts, ro by default
#     - {host: /opt/toolchain, container: /opt/toolchain, mode: ro}
#   env: {}                                         # merged OVER the toolchain defaults
#
#   # WHY keep-id, and why there is no `user:` line above any more.
#   #
#   # v18779 set `user: "65534:65534"`. Under ROOTLESS podman that uid is
#   # mapped to a subordinate uid on the host — a different uid from the one
#   # that owns the bind-mounted workspace — so the container could not write
#   # to its own workspace. Combined with a HOME of /nonexistent on a
#   # read-only root, and a scratch tmpfs that is (correctly) noexec, EVERY
#   # `go` check the agent ran failed, and the failures read as the agent
#   # writing broken code. keep-id maps the container back to the invoking
#   # user, which is both non-root and the workspace owner. Every hardening
#   # flag is unchanged.
#   #
#   # Set `userns: disabled` ONLY for a rootful engine, which rejects keep-id;
#   # then `user:` becomes required again. Setting `user:` together with
#   # keep-id is REJECTED at startup rather than reconciled — the two say
#   # different things about who the container is.
#   #
#   # `env:` is merged OVER these defaults, which exist so the toolchain works
#   # at all: HOME=/tmp, GOCACHE=/tmp/go-build, GOPATH=/tmp/go,
#   # GOTOOLCHAIN=local (nothing can be downloaded with network: none), and
#   # GOTMPDIR=/workspace/.gotmp. GOTMPDIR must NOT be moved to /tmp: `go
#   # test` executes the test binary it links there, and the tmpfs is noexec.
#   # The agent creates /workspace/.gotmp itself before each run.
#   #
#   # memory_limit and tmpfs_size are coupled: /tmp holds the build and module
#   # caches and is charged against the container's memory cgroup. Shrink one
#   # without the other and builds turn into OOM kills.
#
#   # DANGER. Setting this true runs agent tool commands directly on this
#   # host: no container, no network isolation, no filesystem isolation, the
#   # service's full ambient authority. There is no middle setting — if the
#   # sandbox is off and this is not set, the agent refuses to start rather
#   # than pretending a boundary exists.
#   allow_unsandboxed_host_execution: false
#
# loop_guard:      # identical repeated tool calls fail fast
#   enabled: true
#   threshold: 3
#   window: 60s
#
# agentrace:       # one NDJSON event per tool call
#   enabled: true
#   log_path: ~/.local/state/helixon/agentrace-<agent_id>.ndjson
#
# completion:      # a state-changing run must prove itself before it reports done
#   enabled: true
#   verifier_tool: verifier_run
#   mutating_tools: [shell, file_write, verifier_run]
#   max_consecutive_failures: 2   # then STOP and escalate to a human
#
# metrics:         # v18784: hlxn_agent_* series on the --http-addr listener
#   enabled: true
#
#   # With --http-addr set, the agent serves GET /metrics and GET /healthz on
#   # that address. Both used to answer 404: the HTTP channel only had
#   # /api/v1/chat and /api/v1/health, so nothing could scrape the agent and
#   # nothing could liveness-check it. platform.Config.PrometheusRegisterer is
#   # NOT this path — that field belongs to `helixon platform` on :8787, which
#   # serve mode never starts.
#   #
#   # The registry is private to the agent, so /metrics carries hlxn_agent_*
#   # and nothing else. That is deliberate: hlxn_agent_build_info being ABSENT
#   # is how an operator learns the agent is gone, and a shared registry would
#   # let Go runtime series answer a scrape from a process running no agent.
#   #
#   # Escalations are the load-bearing series:
#   #   hlxn_agent_escalations_total{reason="verifier_failed"|"budget_exhausted"|"run_error"}
#   # Before v18784 an escalation only mutated board state and told nobody.
#
# memory:          # v18784: loop memory (Engram) on the ticket path
#   enabled: true
#   engram_url: ""              # NO default; empty means memory is off
#   app_id: helixon
#   workspace_id: ""            # defaults to the runtime tenant
#   max_context: 5
#   timeout: 15s
#
#   # `enabled` defaults true but `engram_url` does not, so upgrading a binary
#   # cannot give an agent a network destination nobody configured — the same
#   # shape as sprintboard.url. $HELIXON_ENGRAM_URL fills an unset value; an
#   # explicit setting here always wins.
#   #
#   # Before a ticket runs, relevant memories are recalled and prepended to the
#   # prompt; after it finishes, a summary of the run (including failures) is
#   # stored. Memory NEVER decides a ticket: a backend that is down or
#   # unreachable degrades the agent and is logged, and the run proceeds.
