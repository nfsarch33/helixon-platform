# runx-public-repo-gate: allow-file fleet_host_alias,network_topology
# WSL1 fleet-agent configuration for helixon serve
# Connects to local LLM router (127.0.0.1:8080), sprintboard (127.0.0.1:9400),
# and registers itself with svcregistryd (127.0.0.1:7777).

agent_id: helixon-fleet-wsl1
system_prompt: |
  You are the wsl1 fleet agent on win1/wsl1 (the Helixon central node).
  You receive tasks from the SprintBoard, execute them using available
  tools (registra, llm-router, engramd, svcregistryd), and report
  results. Be thorough and include evidence of completion.
session_dsn: "file:%h/.local/share/helixon/fleet-wsl1.db?cache=shared&mode=rwc"
max_iterations: 50
max_tokens: 128000
timeout: 10m
heartbeat_every: 30s

provider:
  kind: openai-compat
  base_url: http://127.0.0.1:8080/v1
  model: Qwen3.6-27B-MTP
  # v18778: fleet-agent.service in this directory runs
  # `secrets-bootstrap --service fleet-agent`, which exports the router's
  # bearer as LLM_ROUTER_TOKEN -- it does NOT export OPENAI_API_KEY. This
  # example named the wrong variable, so a reader following it verbatim got
  # `api_key env var "OPENAI_API_KEY" is not set` at startup, which is the
  # same crash loop that ran 300+ times in v14571. The router is the
  # provider, so the router's own token is the credential.
  api_key: "${LLM_ROUTER_TOKEN}"
  timeout: 60s

sprintboard:
  url: http://127.0.0.1:9400
  capabilities: "code,test,review,deploy,registry"

registra:
  registry_path: /home/jaslian/Code/cursor-global-kb/inventory/services/registry.yaml
  bridge_url: http://127.0.0.1:7777
  node_alias: wsl1

# v18779 guardrails. Every block below is OPTIONAL and defaults to ON — an
# absent block is not a disabled guardrail. The values shown are the defaults.
#
# NOTE: since v18779 this file is decoded STRICTLY. An unknown key is now a
# startup error naming the key and line, instead of being silently discarded
# (which is what happened to the `registra:` block above for months).
#
# sandbox:
#   enabled: true
#   engine: podman                                  # the only permitted engine
#   image: docker.io/library/golang:1.26-bookworm   # pinned; must be present
#   network: none                                   # none | bridge
#   user: "65534:65534"                             # non-root
#   memory_limit: 512m
#   pids_limit: 256
#   tmpfs_size: 64m
#   workspace: <process working directory>          # host dir the agent works in
#   workspace_access: rw                            # none | ro | rw
#   workspace_mount: /workspace                     # where it appears inside
#   timeout: 2m
#   max_output_bytes: 65536
#   binds:                                          # extra mounts, ro by default
#     - {host: /opt/toolchain, container: /opt/toolchain, mode: ro}
#   env: {}                                         # the ONLY env the container sees
#
#   # DANGER. Setting this true runs agent tool commands directly on this
#   # host: no container, no network isolation, no filesystem isolation, the
#   # service's full ambient authority. There is no middle setting — if the
#   # sandbox is off and this is not set, the agent refuses to start rather
#   # than pretending a boundary exists.
#   allow_unsandboxed_host_execution: false
#
# loop_guard:      # identical repeated tool calls fail fast
#   enabled: true
#   threshold: 3
#   window: 60s
#
# agentrace:       # one NDJSON event per tool call
#   enabled: true
#   log_path: ~/.local/state/helixon/agentrace-<agent_id>.ndjson
#
# completion:      # a state-changing run must prove itself before it reports done
#   enabled: true
#   verifier_tool: verifier_run
#   mutating_tools: [shell, file_write, verifier_run]
#   max_consecutive_failures: 2   # then STOP and escalate to a human
