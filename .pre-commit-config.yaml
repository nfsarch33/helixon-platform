# Layered Gitleaks (fast regex) + TruffleHog (live verification) pre-push hook.
# Source of truth: cursor-global-kb/templates/.pre-commit-config.yaml (v18725-3).
# Rule: ~/.cursor/rules/00-p0-secrets-pre-push-hook.mdc
# SOP:   sop/secrets-pre-push-hook.md
#
# Install: make precommit-install   (auto-installs pre-commit==3.8.0 if missing)
# Smoke:   echo 'AKIAIOSFODNN7EXAMPLE' >> /tmp/test.py && git add . && git commit -m noop && git push
#          -> push MUST be blocked.
#
# Custom rules live in .gitleaks.toml (one rule per pattern class — see template).
# Tune noise with .gitleaksignore (fingerprint hashes, NOT rule IDs).

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Override the default gitleaks hook entry point to scan committed
      # history (not just staged files). The upstream `id: gitleaks` hook uses
      # `gitleaks protect --staged`, which only sees staged-but-uncommitted
      # changes, so committed secrets would slip past.
      #
      # --log-opts=HEAD scopes the walk to the history reachable from HEAD.
      # Without it gitleaks runs `git log -p -U0 --full-history --all`, i.e.
      # every ref the local clone happens to hold -- so a finding on an
      # unrelated local branch blocks a push that does not contain it, and the
      # scope depends on which branches a developer has lying around rather
      # than on what is being pushed. Scoping to HEAD is strictly safer than a
      # range: it still covers the whole history being published.
      - id: gitleaks
        name: Gitleaks (full-history scan)
        stages: [pre-push]
        # Override the entry: scan the entire repo with our custom ruleset.
        # --no-banner keeps output clean; --redact hides the secret in logs.
        entry: gitleaks detect --no-banner --redact --config .gitleaks.toml --source . --log-opts=HEAD
        language: golang
        # pre-push scans the entire repo, not per-file.
        pass_filenames: false

  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.95.9
    hooks:
      - id: trufflehog
        name: TruffleHog (live verification)
        # Verify the key still works on the upstream provider. --only-verified
        # cuts noise from test fixtures + synthetic keys. --fail exits non-zero
        # when a verified live secret is found. --no-update keeps the hook from
        # reaching out to upgrade itself mid-push.
        #
        # Was: `trufflehog git file://. --since-commit HEAD --only-verified --fail`.
        # TruffleHog's range is since..tip, EXCLUSIVE of since, so since=HEAD is
        # the EMPTY range: the hook scanned nothing and passed every push since
        # it was added. The same flag was measured elsewhere in this estate as
        # 0 chunks / 0 bytes scanned while the history under test held verified
        # live credentials. A hook that cannot fail is not a gate.
        entry: trufflehog git file://. --only-verified --fail --no-update
        language: system
        stages: [pre-push]
        # TruffleHog scans the entire repo, not per-file.
        pass_filenames: false