version: "2"
run:
  timeout: 5m
  tests: true

linters:
  # v2 spelling of v1's `disable-all: true`. The v1 key is not merely
  # renamed, it is rejected by the v2 schema -- but `golangci-lint run`
  # does not validate the config, so the stale key sat here silently while
  # `linters.default` fell back to `standard`. That happened to be harmless
  # (the enable list below is a superset of `standard`), which is exactly
  # what made it invisible. `config verify` in CI is what makes the next
  # one loud; see the lint-config job in .github/workflows/ci.yml.
  default: none
  enable:
    - errcheck       # unchecked errors
    - govet          # standard go vet
    - ineffassign    # unused assignments
    - staticcheck    # advanced checks (includes gosimple + stylecheck in v2)
    - unused         # unused identifiers
    - misspell       # common misspellings
    - bodyclose      # http body close
    - nilerr         # returning nil after error
    - contextcheck   # context propagation
    - durationcheck  # time.Duration multiplication
    - errorlint      # error wrapping
    - exhaustive     # enum exhaustiveness
    - gocritic       # opinionated checks
    - gosec          # security
    - prealloc       # pre-allocation
    - revive         # golint replacement
    - tparallel      # parallel t.Run
    - unconvert      # unnecessary conversions
    - unparam        # unused parameters
    - whitespace     # whitespace
  settings:
    gosec:
      severity: medium
      confidence: medium
    revive:
      severity: warning
    misspell:
      locale: US
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-tags:
        - experimental
    staticcheck:
      checks: ["all"]
    errorlint:
      asserts: false
      comparison: false
  exclusions:
    # These replace a repository-wide `linters.settings.gosec.excludes` of
    # [G115, G404]. A repo-wide exclude silences the rule everywhere,
    # including in code not yet written, and its justification named a
    # single file -- one that turned out to carry no G115 finding at all.
    # Each rule below is scoped to the files that actually raise it, so a
    # G115 or G404 in any other file is a finding again.
    rules:
      # newTraceID encodes a ULID MSB-first: every `byte(ms >> n)` truncates
      # by design, which is the whole point of the encoding. Six sites.
      - path: internal/helixon/agentrace\.go
        linters:
          - gosec
        text: G115

      # `string(rune('a'+i))` derives a distinct key per iteration from a
      # loop index bounded by a small literal, in test fixtures only.
      - path: (internal/notify/notifydb/db|internal/notify/telegram/telegramop|internal/rtx/rtx)_test\.go$
        linters:
          - gosec
        text: G115

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

output:
  # v1 carried `format: tab` plus `print-issued-lines` / `print-linter-name`
  # at this level. All three were rejected by the v2 schema and therefore
  # inert, so what CI and internal/lint have actually been parsing all along
  # is the v2 *default*: `text`, with both flags on. This block states that
  # default explicitly rather than dropping it, because internal/lint parses
  # the linter name out of the "... (linter)" suffix -- `tab` was never in
  # effect and restoring it would break that harness.
  formats:
    text:
      print-issued-lines: true
      print-linter-name: true
