name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # MUST stay false on the self-hosted runner. setup-go@v5 defaults
          # cache to true, and its post-job cache-save tars go into
          # uninterruptible sleep on this substrate, pinning the single runner
          # this repository has until the timeout. One such tar held it for
          # 5h38m with nine runs queued behind it. ~/go survives between jobs
          # on a persistent runner anyway, so the cache buys nothing here.
          cache: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
