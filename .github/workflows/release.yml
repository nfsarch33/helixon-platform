name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: [self-hosted, linux]
    # This workflow fires only on v* tags and has still never executed, so
    # there is no duration of its own to size against. There is now a good
    # proxy: the Image workflow runs this same goreleaser invocation on every
    # PR, differing only in that it skips publishing. That measures at 1m1s
    # warm and 2m33s cold, and the two image builds are now a FROM/COPY, not
    # a compile.
    #
    # The old justification for this number no longer holds and is worth
    # recording, because it was the shape of the bug: the root Dockerfile used
    # to compile the binary INSIDE the image, so the arm64 leg did that whole
    # build under QEMU and was assumed to be a tens-of-minutes long pole. It
    # was not slow, it was broken -- goreleaser's build context has no source
    # tree, so that Dockerfile could never build here at all.
    #
    # 90m is kept anyway. It is no new ceiling (sandbox-integration already
    # holds the runner that long), it still cuts an uncapped release hang to a
    # quarter of the 360m default, and the real risk here is publishing to
    # ghcr, which is network-bound and unmeasured. Note `[self-hosted, linux]`
    # resolves to the same single runner every other job queues behind.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # MUST stay false on the self-hosted runner. setup-go@v5 defaults
          # cache to true, and its post-job cache-save tars go into
          # uninterruptible sleep on this substrate, pinning the single runner
          # this repository has until the timeout. One such tar held it for
          # 5h38m with nine runs queued behind it. ~/go survives between jobs
          # on a persistent runner anyway, so the cache buys nothing here.
          cache: false
      # No setup-qemu-action. It was here to emulate arm64 for a Dockerfile
      # that compiled inside the image; the Dockerfile now only does
      # FROM/COPY/ENTRYPOINT, which executes no target-architecture
      # instruction, so buildx assembles the arm64 image on an amd64 host with
      # no binfmt handler. The Image workflow proves this on every PR by
      # running the identical build with no QEMU step and asserting the
      # resulting image carries an aarch64 binary.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
