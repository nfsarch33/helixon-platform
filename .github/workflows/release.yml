name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: [self-hosted, linux]
    # The most generous cap here, and the only one with no measurement behind
    # it: this workflow fires only on v* tags and has never executed, so there
    # is no duration to size against.
    #
    # Sized from what it would have to do rather than from history. The four
    # cross-compiled targets are cheap, but the two container images are not:
    # the root Dockerfile is multi-stage and compiles the binary INSIDE the
    # image (`go mod download` then a CGO-enabled `go build`), so the arm64
    # image does that whole build under QEMU emulation. That is the long pole
    # and it can be tens of minutes.
    #
    # 90m keeps the repository's worst-case single-job hold exactly where
    # sandbox-integration already put it, so this adds no new ceiling while
    # still cutting an uncapped release hang to a quarter of the 360m
    # default. Note `[self-hosted, linux]` resolves to the same single runner
    # every other job here queues behind, so a release hang costs precisely
    # what a CI hang costs. Worth re-sizing once this has run even once.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          # MUST stay false on the self-hosted runner. setup-go@v5 defaults
          # cache to true, and its post-job cache-save tars go into
          # uninterruptible sleep on this substrate, pinning the single runner
          # this repository has until the timeout. One such tar held it for
          # 5h38m with nine runs queued behind it. ~/go survives between jobs
          # on a persistent runner anyway, so the cache buys nothing here.
          cache: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
