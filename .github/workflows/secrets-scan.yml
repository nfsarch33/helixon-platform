name: Secrets scan

# CI parity for the Gitleaks + TruffleHog pre-push hook (v18725, mirrored in v18734-3).
# Runs on every PR + push to default branches; fails the build on any
# finding. Fork PRs (which bypass the local hook) are caught here.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (full-history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install and scan live in a script so the same code path can be run and
      # tested locally: .github/scripts/gitleaks-scan-tests.sh. The script
      # resolves the release asset by name instead of hand-building a URL. The
      # previous inline version pinned "gitleaks_8.30.1_linux_amd64.tar.gz",
      # which gitleaks had renamed to "..._linux_x64.tar.gz"; the download 404'd
      # on every run, so this check reported for months without ever scanning
      # a commit.
      - name: Scan (install + full-history detect)
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_REPORT_PATH: /tmp/gitleaks.sarif
          GITLEAKS_RECEIPT_PATH: /tmp/gitleaks-receipt.json
        run: .github/scripts/gitleaks-scan.sh

      # The gate's integrity check. The scan script writes a receipt only after
      # gitleaks has actually produced a verdict, so a missing receipt means the
      # scanner never ran -- and that must be reported as its own, clearly
      # labelled failure rather than being left to look like a scan result.
      #
      # Note this deliberately does not use hashFiles() to test for the report:
      # hashFiles only matches paths under GITHUB_WORKSPACE and returns an empty
      # string for anything else, so it would silently evaluate to "absent" for
      # a file in /tmp -- the same class of quiet mis-evaluation being fixed here.
      - name: Verify the gate actually ran
        id: receipt
        if: always()
        run: |
          set -uo pipefail
          report=/tmp/gitleaks.sarif
          receipt=/tmp/gitleaks-receipt.json

          if [ -s "$report" ]; then
            echo "sarif=true" >>"$GITHUB_OUTPUT"
          else
            echo "sarif=false" >>"$GITHUB_OUTPUT"
          fi

          if [ ! -s "$receipt" ]; then
            echo "::error::Gitleaks produced no receipt: the secret scan did NOT run."
            echo "::error::This is an infrastructure failure of the gate itself, not a clean scan."
            echo "::error::Treat this repository as UNSCANNED until the step above is fixed."
            {
              echo "### Gitleaks (full-history): DID NOT RUN"
              echo
              echo "The scanner never produced a verdict, so this commit is **unscanned**."
              echo "The \`Scan\` step above exited \`${{ steps.scan.outcome }}\`."
              echo
              echo "Exit codes from \`.github/scripts/gitleaks-scan.sh\`:"
              echo "\`3\` = install failed (asset/download/checksum/version),"
              echo "\`4\` = the scan did not complete."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Gitleaks receipt:"
          cat "$receipt"
          findings=$(jq -r '.findings' "$receipt")
          commits=$(jq -r '.commits_scanned' "$receipt")
          version=$(jq -r '.version' "$receipt")
          echo "::notice::gitleaks v${version} scanned ${commits} commits and reported ${findings} finding(s)."

      # Guarded on the report existing, so a failed scan step surfaces as the
      # scan failure it is instead of being buried under "Path does not exist".
      # continue-on-error keeps the code-scanning upload -- a convenience -- from
      # ever becoming the thing that decides whether this gate passes.
      - name: Upload SARIF
        if: always() && steps.receipt.outputs.sarif == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: /tmp/gitleaks.sarif
          category: gitleaks

      - name: Upload SARIF artifact
        if: always() && steps.receipt.outputs.sarif == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: |
            /tmp/gitleaks.sarif
            /tmp/gitleaks-receipt.json
          if-no-files-found: warn

  trufflehog:
    name: TruffleHog (live verification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      # This step previously ran with `--since-commit HEAD`, which selects the
      # commits *after* HEAD -- the empty set. The job checked out full history,
      # reported "live verification", scanned 0 chunks and 0 bytes, and exited 0
      # in about eleven seconds. Measured on the same tree: with the flag, 0
      # chunks; without it, 4137 chunks over 7.1 MB.
      #
      # The redirection was wrong in the same direction: TruffleHog writes
      # findings to stdout and its log to stderr, so `--json 2>findings.json`
      # archived the log as evidence and let the findings go to the console.
      - name: Scan (full history, live verified)
        id: scan
        run: |
          set -uo pipefail
          trufflehog git "file://$PWD" --only-verified --json \
            >/tmp/trufflehog-findings.json 2>/tmp/trufflehog-scan.log || true
          echo "wrote $(wc -c </tmp/trufflehog-findings.json) bytes of findings"

      # A scanner that scans nothing also exits 0, so the verdict is taken from
      # the stats line rather than the exit code: zero chunks means the gate did
      # not run and must fail as an infrastructure error, distinct from a clean
      # scan. This mirrors the gitleaks receipt in the job above.
      - name: Verify the gate actually ran
        if: always()
        run: |
          set -uo pipefail
          stats=$(grep '"msg":"finished scanning"' /tmp/trufflehog-scan.log | tail -1 || true)
          if [ -z "$stats" ]; then
            echo "::error::TruffleHog produced no completion record: the scan did NOT run."
            echo "### TruffleHog: DID NOT RUN" >>"$GITHUB_STEP_SUMMARY"
            tail -20 /tmp/trufflehog-scan.log || true
            exit 1
          fi

          chunks=$(echo "$stats" | jq -r '.chunks // 0')
          bytes=$(echo "$stats"  | jq -r '.bytes // 0')
          verified=$(echo "$stats" | jq -r '.verified_secrets // 0')
          version=$(echo "$stats" | jq -r '.trufflehog_version // "unknown"')

          # Guard the comparisons below: if the stats line ever stops being the
          # JSON we expect, say so, rather than failing on an integer test and
          # leaving a bash error as the whole explanation of a red gate.
          case "$chunks$verified" in
            *[!0-9]*|'')
              echo "::error::Could not parse TruffleHog's completion record; treating this commit as unverified."
              echo "stats line was: $stats"
              exit 1
              ;;
          esac

          if [ "$chunks" -eq 0 ]; then
            echo "::error::TruffleHog scanned 0 chunks. The gate did NOT run; treat this commit as unverified."
            {
              echo "### TruffleHog: DID NOT RUN"
              echo
              echo "Completed with \`chunks=0\`, so nothing was verified."
              echo "This is an infrastructure failure of the gate, not a clean scan."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::notice::TruffleHog v${version} scanned ${chunks} chunks (${bytes} bytes) and verified ${verified} live credential(s)."

          if [ "$verified" -gt 0 ]; then
            echo "::error::TruffleHog verified ${verified} LIVE credential(s). See the trufflehog-findings artifact."
            {
              echo "### TruffleHog: ${verified} LIVE credential(s)"
              echo
              echo "A verified credential is one the detector authenticated against the"
              echo "live service. Rotate it before doing anything else with this branch."
            } >>"$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-findings
          path: |
            /tmp/trufflehog-findings.json
            /tmp/trufflehog-scan.log
          if-no-files-found: warn
