# runx-public-repo-gate: allow-file fleet_host_alias,network_topology,personal_path_id
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: self-hosted
    # There is ONE self-hosted runner for this repository, so a job with no
    # cap holds it for GitHub's 360-minute default and takes the whole
    # repository's CI offline. A wedged process did exactly that for 5h38m
    # with nine runs queued behind it. PR #82 removed that particular cause;
    # these caps bound the cost of the next one, whatever it turns out to be.
    #
    # Measured across 29 executed runs: 2m21s fastest, 10m13s median, 11m38s
    # slowest. Most of that is the 10m per-package deadline `go test` applies,
    # which internal/agent/livechannel is currently hitting; the real work
    # (build, vet, coverage) is about 2m. 30m is ~2.5x the slowest run
    # observed, and matches the cap the sibling repositories use.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # MUST stay false on the self-hosted runner. setup-go@v5 defaults
          # cache to true, and its post-job cache-save tars go into
          # uninterruptible sleep on this substrate, pinning the single runner
          # this repository has until the timeout. One such tar held it for
          # 5h38m with nine runs queued behind it. ~/go survives between jobs
          # on a persistent runner anyway, so the cache buys nothing here.
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        # -shuffle=on randomises test and subtest order so ordering assumptions
        # cannot hide behind declaration order. The agent loop's turn-ordering
        # defect (fixed in #78) was only reproducible under shuffle; this keeps
        # that class of regression visible. A failure prints the seed, and
        # `go test -shuffle=<seed>` replays it.
        #
        # HLXN_ENGRAM_LIVE_REQUIRED turns the memory package's live daemon
        # roundtrip from a skip into a failure when the daemon does not answer.
        # The runner shares a host with the daemon, so a skip here would be a
        # gate that cannot fail: wire-schema drift would read as green.
        env:
          HLXN_ENGRAM_LIVE_REQUIRED: "1"
        run: go test -race -shuffle=on -cover -coverprofile=coverage.txt -count=1 ./...
      - name: Coverage check
        run: |
          total=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          threshold=75
          if [ "$(echo "$total < $threshold" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi

  security:
    runs-on: self-hosted
    # The scanners themselves are quick: 22s to 2m11s of real work across 27
    # executed runs, and 54s green on the merge result that introduced
    # `cache: false`. The 39m-161m outliers in this job's history were
    # entirely setup-go's cache-save step, which PR #82 disabled. 15m leaves
    # room for a cold trivy download and two `go install ...@latest` builds
    # on a loaded host, and still bounds a hang to minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # MUST stay false on the self-hosted runner. setup-go@v5 defaults
          # cache to true, and its post-job cache-save tars go into
          # uninterruptible sleep on this substrate, pinning the single runner
          # this repository has until the timeout. One such tar held it for
          # 5h38m with nine runs queued behind it. ~/go survives between jobs
          # on a persistent runner anyway, so the cache buys nothing here.
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: nancy (dependency audit)
        run: |
          go install github.com/sonatype-nexus-community/nancy@latest
          go list -json -deps ./... | nancy sleuth
        continue-on-error: true
      - name: trivy fs (vuln + secret + misconfig)
        run: |
          if ! command -v trivy >/dev/null 2>&1; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sh -s -- -b "$(go env GOPATH)/bin" v0.58.1
          fi
          trivy fs --scanners vuln,secret,misconfig --exit-code 0 --severity HIGH,CRITICAL --no-progress .
        continue-on-error: true

  public-repo-gate:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # The gate lives in a script so it can be run and tested locally:
      # .github/scripts/public-repo-gate-tests.sh. The previous inline version
      # suppressed findings with `grep -v 'public-repo-gate'`, which drops the
      # annotation LINE rather than the annotated FILE -- so the allow-file
      # headers this repository carries did nothing, and the gate could not pass.
      - name: Scan for blocked terms
        run: .github/scripts/public-repo-gate.sh

  setup-go-cache-gate:
    # ubuntu-latest ON PURPOSE, and it is not an optimisation. A gate whose
    # entire job is protecting the sole self-hosted runner's availability must
    # not queue behind that runner, and must not be wedgeable by the failure
    # it exists to detect. It is pure Python and needs no Go toolchain, so it
    # has no actions/setup-go step of its own to pin.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install --disable-pip-version-check --quiet pyyaml

      # Run the controls BEFORE the gate. A checker that cannot fail turns a
      # green verdict into a statement about nothing, and that is the exact
      # way CI has lied in this estate before. --self-test drives synthetic
      # fixtures in both directions; --mutation-test deletes and flips each
      # real `cache: false` pin in a scratch copy of .github/workflows and
      # requires a violation every time.
      - name: Prove the checker fails on fixtures (self-test)
        run: python3 tools/check-setup-go-cache.py --self-test

      - name: Prove the checker fails on this repo's workflows (mutation test)
        run: python3 tools/check-setup-go-cache.py --mutation-test

      - name: "Assert every actions/setup-go step pins cache: false"
        run: python3 tools/check-setup-go-cache.py
