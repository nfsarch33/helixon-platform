# runx-public-repo-gate: allow-file fleet_host_alias,network_topology
# Example agent.toml for helixon-fleet-agent v0.5.0.
#
# Generated by `fleet-agent install --config agent.toml`.
# Edit operator-tuned fields; the installer preserves them across re-runs.

# This node's identifier. Set automatically by `fleet-agent install` if
# missing; the value here is just a hint.
node_id: "wsl1"

# Path to the ed25519 host private key (PKCS#8 PEM, mode 0600).
# The installer creates one with `EnsureHostKey` if missing.
host_key_path: "/etc/helixon/host_ed25519"

# svcregistryd base URL. The agent heartbeats to this URL every
# HeartbeatInterval (30s) with bounded backoff on errors.
registry_url: "http://127.0.0.1:7777"

# HTTP control plane listen address.
http_addr: ":8686"

# Peer allowlist: which other node IDs may call /v1/control/* on this agent.
# Empty list = reject all (fail-closed). Populated from svcregistryd on
# `fleet-agent serve` start.
peer_allowlist:
  - "wsl1"
  - "wsl2"
  - "wsl4"

# Optional heartbeat override (Go duration string). Default 30s.
heartbeat_every: "30s"
